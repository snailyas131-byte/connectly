{% extends "base.html" %}

{% block title %}404 Not Found &bull; Connectly{% endblock %}

{% block content %}
<div class="empty-state" style="max-width: 520px; margin: 4rem auto;">
  <div class="empty-icon" style="background: var(--warning-light); color: var(--warning);">
    <i class="fas fa-search-location"></i>
  </div>
  <h1 class="empty-title">404 &bull; Page Not Found</h1>
  <p class="empty-description">
    The contact or page you are looking for does not exist or may have been deleted.
  </p>
  <a href="{{ url_for('contacts.dashboard') if current_user.is_authenticated else url_for('contacts.index') }}" class="btn btn-primary">
    <i class="fas fa-home"></i> Back to Safety
  </a>
</div>
{% endblock %}
