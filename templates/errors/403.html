{% extends "base.html" %}

{% block title %}403 Forbidden &bull; Connectly{% endblock %}

{% block content %}
<div class="empty-state" style="max-width: 520px; margin: 4rem auto;">
  <div class="empty-icon" style="background: var(--danger-light); color: var(--danger);">
    <i class="fas fa-lock"></i>
  </div>
  <h1 class="empty-title">403 &bull; Access Forbidden</h1>
  <p class="empty-description">
    You do not have permission to view or modify this resource. Contacts belong exclusively to their respective owners.
  </p>
  <a href="{{ url_for('contacts.dashboard') if current_user.is_authenticated else url_for('contacts.index') }}" class="btn btn-primary">
    <i class="fas fa-home"></i> Return to Dashboard
  </a>
</div>
{% endblock %}
