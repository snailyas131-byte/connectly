{% extends "base.html" %}

{% block title %}500 Internal Server Error &bull; Connectly{% endblock %}

{% block content %}
<div class="empty-state" style="max-width: 520px; margin: 4rem auto;">
  <div class="empty-icon" style="background: var(--danger-light); color: var(--danger);">
    <i class="fas fa-server"></i>
  </div>
  <h1 class="empty-title">500 &bull; Server Error</h1>
  <p class="empty-description">
    Something unexpected happened on our server. Our team has been notified and is looking into it.
  </p>
  <a href="{{ url_for('contacts.dashboard') if current_user.is_authenticated else url_for('contacts.index') }}" class="btn btn-primary">
    <i class="fas fa-home"></i> Back to Safety
  </a>
</div>
{% endblock %}
