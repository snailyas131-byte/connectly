{% extends "base.html" %}

{% block title %}File Too Large &bull; Connectly{% endblock %}

{% block content %}
<div class="empty-state" style="max-width: 520px; margin: 4rem auto;">
  <div class="empty-icon" style="background: var(--warning-light); color: var(--warning);">
    <i class="fas fa-file-upload"></i>
  </div>
  <h1 class="empty-title">413 &bull; File Too Large</h1>
  <p class="empty-description">
    The uploaded file exceeds the maximum allowed size limit (5MB). Please choose a smaller file.
  </p>
  <a href="{{ url_for('contacts.dashboard') }}" class="btn btn-primary">
    <i class="fas fa-arrow-left"></i> Back to Dashboard
  </a>
</div>
{% endblock %}
