{% extends "base.html" %}

{% block title %}Sign In &bull; Connectly{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 3rem; height: 3rem; font-size: 1.5rem;">
        <i class="fas fa-lock"></i>
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em;">Welcome Back</h1>
      <p style="color: var(--text-secondary); font-size: 0.95rem; margin-top: 0.25rem;">
        Sign in to access your personal contact book
      </p>
    </div>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="email" class="form-label">Email Address <span class="required">*</span></label>
        <div style="position: relative;">
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="you@example.com" 
            value="{{ email if email is defined else '' }}"
            required 
            autofocus
          >
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label for="password" class="form-label">Password <span class="required">*</span></label>
        </div>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="••••••••" 
          required
        >
      </div>

      <div class="form-group" style="margin-bottom: 1.75rem;">
        <label class="form-check">
          <input type="checkbox" name="remember" value="1">
          <span>Remember me on this device</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-secondary);">
      Don't have an account yet? 
      <a href="{{ url_for('auth.register') }}" style="font-weight: 600;">Create Account</a>
    </div>
  </div>
</div>
{% endblock %}
