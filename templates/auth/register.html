{% extends "base.html" %}

{% block title %}Create Account &bull; Connectly{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 2rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 3rem; height: 3rem; font-size: 1.5rem;">
        <i class="fas fa-user-plus"></i>
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em;">Create Your Account</h1>
      <p style="color: var(--text-secondary); font-size: 0.95rem; margin-top: 0.25rem;">
        Start managing your contacts securely
      </p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="full_name" class="form-label">Full Name <span class="required">*</span></label>
        <input 
          type="text" 
          id="full_name" 
          name="full_name" 
          class="form-control" 
          placeholder="e.g. Alex Morgan" 
          value="{{ full_name if full_name is defined else '' }}"
          required 
          autofocus
        >
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="email" class="form-label">Email Address <span class="required">*</span></label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="alex@example.com" 
          value="{{ email if email is defined else '' }}"
          required
        >
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="password" class="form-label">Password <span class="required">*</span></label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="At least 6 characters" 
          required 
          minlength="6"
        >
      </div>

      <div class="form-group" style="margin-bottom: 1.75rem;">
        <label for="confirm_password" class="form-label">Confirm Password <span class="required">*</span></label>
        <input 
          type="password" 
          id="confirm_password" 
          name="confirm_password" 
          class="form-control" 
          placeholder="Repeat your password" 
          required 
          minlength="6"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
        <i class="fas fa-arrow-right"></i> Complete Registration
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-secondary);">
      Already have an account? 
      <a href="{{ url_for('auth.login') }}" style="font-weight: 600;">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
